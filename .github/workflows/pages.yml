# Builds the site (npm run build-site: site/index.html, the latest gap report, the packaged extension)
# and publishes it to GitHub Pages. The daily run keeps the README status badges current, and first rebuilds
# the extension on the latest data sources: if its data changed, it bumps the build number (x.y.BUILD) and
# commits that to main. Major and minor are bumped by hand in extension/package.json; set build to 0 then.
# Any run whose extension version has no GitHub Release yet publishes the .vsix to the VS Code Marketplace,
# then creates the release (tag vX.Y.Z) with the .vsix attached.
# One-time setup: Settings → Pages → Source: GitHub Actions, and a VSCE_PAT repo secret (Marketplace → Manage).
name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, reports/latest.json, extension/**, tools/cli.mjs, .github/workflows/pages.yml]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild the extension on the latest data
        if: github.event_name != 'push'
        run: |
          node tools/cli.mjs update
          node tools/build-extension.mjs
          # CONTENTS.md carries the build date, so only data/ says whether anything really changed
          if git diff --quiet -- extension/data; then git checkout -- .; exit 0; fi
          v=$(cd extension && npm version patch --no-git-tag-version)
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add extension package.json package-lock.json
          git commit -m "Extension $v: data update"
          git push
      - run: npm run build-site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Release the extension if its version is new
        env:
          GH_TOKEN: ${{ github.token }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          v=v$(node -p "require('./extension/package.json').version")
          gh release view "$v" >/dev/null 2>&1 && exit 0
          # Marketplace first: if it fails, no release is made and the next run retries
          if [ -n "$VSCE_PAT" ]; then
            npx -y @vscode/vsce@4 publish --packagePath _site/web-spec-additions.vsix --skip-duplicate
          else
            echo "::warning::VSCE_PAT secret not set, so $v wasn't published to the Marketplace"
          fi
          cat extension/CONTENTS.md - > notes.md <<'EOF'

          ## Install

          Download `web-spec-additions.vsix` from **Assets** below. Don't double-click it: Windows opens `.vsix` files with Visual Studio's installer, which can't install VS Code extensions. Instead, either:

          - In VS Code, open the Extensions view, click **⋯** (Views and More Actions), choose **Install from VSIX…** and pick the file. The Command Palette has the same command: **Extensions: Install from VSIX…**
          - Or, from a terminal in your downloads folder: `code --install-extension web-spec-additions.vsix --force`

          Reload the window if VS Code asks.
          EOF
          gh release create "$v" _site/web-spec-additions.vsix --title "Extension $v" --notes-file notes.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
